<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPERASYON: IZMIR - READY OR NOT</title>
    <style>
        :root {
            --police-blue: #1e3a8a;
            --danger-red: #991b1b;
            --overlay: rgba(0, 0, 0, 0.7);
        }

        body {
            margin: 0; background: #000; color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; touch-action: none;
            display: flex; align-items: center; justify-content: center; height: 100vh;
        }

        /* Oyun Sahnesi */
        #game-screen {
            position: relative; width: 100vw; height: 100vh;
            background: url('https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?q=80&w=1287&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            display: none;
        }

        /* Karartma ve Atmosfer */
        #vignette {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, black 120%);
            pointer-events: none;
        }

        /* Silah ve Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 30px; height: 30px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Arayüz (HUD) */
        #hud {
            position: absolute; bottom: 20px; left: 20px;
            background: var(--overlay); padding: 15px;
            border-left: 5px solid var(--police-blue);
        }

        /* Giriş Menüsü */
        #menu {
            text-align: center; z-index: 10; padding: 20px;
            background: var(--overlay); border: 2px solid var(--police-blue);
        }

        #status-msg {
            position: absolute; top: 20%; width: 100%;
            text-align: center; font-size: 24px; font-weight: bold;
            color: #fbbf24; text-shadow: 2px 2px 4px #000;
        }

        /* Düşman/Hedef */
        .target {
            position: absolute; width: 150px; height: 250px;
            background: url('https://i.imgur.com/vH9YkC9.png') no-repeat center center; /* Örnek düşman görseli */
            background-size: contain; cursor: crosshair;
            transition: opacity 0.2s;
        }

        button {
            padding: 15px 30px; font-size: 18px; cursor: pointer;
            background: var(--police-blue); color: white; border: none;
            margin-top: 20px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1 style="color: #3b82f6;">OPERASYON: İZMİR</h1>
        <p>Baskın Noktası: Eski Fabrika Sığınağı</p>
        <p style="font-size: 12px; color: #94a3b8;">"Ready or Not" Taktik Modu Aktif</p>
        <button onclick="startGame()">OPERASYONU BAŞLAT</button>
    </div>

    <div id="game-screen" onclick="shoot(event)">
        <div id="vignette"></div>
        <div id="crosshair"></div>
        <div id="status-msg"></div>

        <div id="hud">
            <div>DURUM: <span id="police-status">Sızma Yapıldı</span></div>
            <div>MERMİ: <span id="ammo">15</span> / 45</div>
            <div>SAĞLIK: %<span id="health">100</span></div>
        </div>
    </div>

    <audio id="snd-shoot" src="https://www.soundjay.com/mechanical/gun-shot-01.mp3"></audio>
    <audio id="snd-reload" src="https://www.soundjay.com/mechanical/gun-cocking-01.mp3"></audio>

<script>
    let health = 100;
    let ammo = 15;
    let score = 0;
    let isGameRunning = false;

    function startGame() {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        isGameRunning = true;
        spawnEnemy();
        document.getElementById('status-msg').innerText = "KAPIYI PATLAT! İÇERİ GİR!";
        setTimeout(() => { document.getElementById('status-msg').innerText = ""; }, 3000);
    }

    function shoot(e) {
        if (!isGameRunning || ammo <= 0) {
            if(ammo <= 0) reload();
            return;
        }

        // Ateş sesi ve mekaniği
        const snd = document.getElementById('snd-shoot');
        snd.currentTime = 0;
        snd.play();

        ammo--;
        document.getElementById('ammo').innerText = ammo;

        // Geri tepme efekti (Ekran sallanması)
        document.getElementById('game-screen').style.transform = "translateY(-5px)";
        setTimeout(() => { document.getElementById('game-screen').style.transform = "translateY(0)"; }, 500);
    }

    function reload() {
        document.getElementById('status-msg').innerText = "ŞARJÖR DEĞİŞTİRİLİYOR...";
        document.getElementById('snd-reload').play();
        setTimeout(() => {
            ammo = 15;
            document.getElementById('ammo').innerText = ammo;
            document.getElementById('status-msg').innerText = "";
        }, 1500);
    }

    function spawnEnemy() {
        if (!isGameRunning) return;

        const enemy = document.createElement('div');
        enemy.className = 'target';
        enemy.style.left = Math.random() * (window.innerWidth - 150) + "px";
        enemy.style.top = (Math.random() * (window.innerHeight - 300) + 100) + "px";
        
        enemy.onclick = function(e) {
            e.stopPropagation();
            playBloodEffect(e.pageX, e.pageY);
            this.remove();
            score++;
            document.getElementById('police-status').innerText = score + " Şüpheli Etkisiz";
            setTimeout(spawnEnemy, Math.random() * 2000 + 500);
        };

        document.getElementById('game-screen').appendChild(enemy);

        // Düşman ateş etme süresi (Eğer 2 saniye içinde vurmazsan canın gider)
        setTimeout(() => {
            if (enemy.parentElement) {
                takeDamage();
                enemy.remove();
                setTimeout(spawnEnemy, 1000);
            }
        }, 2000);
    }

    function takeDamage() {
        health -= 20;
        document.getElementById('health').innerText = health;
        document.getElementById('game-screen').style.boxShadow = "inset 0 0 100px red";
        setTimeout(() => { document.getElementById('game-screen').style.boxShadow = "none"; }, 3000);

        if (health <= 0) {
            alert("OPERASYON BAŞARISIZ! Vuruldun.\nEtkisiz hale getirilen suçlu: " + score);
            location.reload();
        }
    }

    function playBloodEffect(x, y) {
        // Basit vuruş efekti yapılabilir
    }
</script>
</body>
</html>
