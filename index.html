<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ENES_SNAKE_PRO_V3</title>
    <style>
        body { margin: 0; background: #87CEEB; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        canvas { background: rgba(255, 255, 255, 0.3); border-radius: 20px; margin-top: 10px; width: 330px; height: 330px; }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .btn { width: 70px; height: 70px; background: white; border: none; border-radius: 20px; font-size: 30px; }
    </style>
</head>
<body>
    <div style="text-align:center; margin-top:10px;">Puan: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">
        <button class="btn" style="grid-column: 2;" onclick="setDir(0, -20)">▲</button>
        <button class="btn" style="grid-column: 1;" onclick="setDir(-20, 0)">◀</button>
        <button class="btn" style="grid-column: 3;" onclick="setDir(20, 0)">▶</button>
        <button class="btn" style="grid-column: 2;" onclick="setDir(0, 20)">▼</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let snake = [{x: 200, y: 200}], dx = 20, dy = 0, food = {x: 100, y: 100}, score = 0;
        let lastTime = 0, speed = 150;

        function setDir(x, y) { if (x !== -dx && y !== -dy) { dx = x; dy = y; } }

        function draw(time) {
            requestAnimationFrame(draw);
            if (time - lastTime < speed) return;
            lastTime = time;

            // Hareket
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10; document.getElementById('score').innerText = score;
                food = {x: Math.floor(Math.random()*20)*20, y: Math.floor(Math.random()*20)*20};
            } else { snake.pop(); }

            // Çizim
            ctx.clearRect(0, 0, 400, 400);
            // Elma
            ctx.fillStyle = "red"; ctx.fillRect(food.x, food.y, 18, 18);
            // Yılan
            ctx.fillStyle = "#2ecc71";
            snake.forEach((part, i) => {
                ctx.fillRect(part.x, part.y, 18, 18);
                // Ağız açma animasyonu (Elmaya yakınsa)
                if(i === 0 && Math.hypot(head.x - food.x, head.y - food.y) < 60) {
                    ctx.fillStyle = "white";
                    ctx.fillRect(part.x + (dx > 0 ? 10 : -5), part.y + 5, 10, 8);
                }
            });
        }
        requestAnimationFrame(draw);
    </script>
</body>
</html>
