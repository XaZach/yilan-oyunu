<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OPERASYON: IZMIR - 3D TACTICAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        /* Arayüz (HUD) */
        #hud {
            position: absolute; bottom: 20px; left: 20px; color: #00ff00;
            text-shadow: 0 0 5px #00ff00; font-family: 'Courier New', monospace;
            pointer-events: none; z-index: 10;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            border: 2px solid #00ff00; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }

        /* Gece Görüşü Efekti */
        #nvg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0, 50, 0, 0.4) 100%);
            pointer-events: none; border: 1px solid rgba(0, 255, 0, 0.1);
            box-shadow: inset 0 0 100px rgba(0, 255, 0, 0.2);
            z-index: 5;
        }

        #menu {
            position: absolute; width: 100%; height: 100%; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; color: #00ff00; text-align: center;
        }

        button {
            padding: 15px 30px; background: transparent; border: 2px solid #00ff00;
            color: #00ff00; font-size: 20px; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>OPERASYON: İZMİR <br> <span style="font-size: 15px;">3D TACTICAL SIMULATION</span></h1>
        <button onclick="startOperation()">SİSTEMİ BAŞLAT</button>
    </div>

    <div id="nvg-overlay"></div>
    <div id="crosshair"></div>
    <div id="hud">
        STATUS: INFILTRATED<br>
        AMMO: <span id="ammo">15</span>/45<br>
        THREATS ELIMINATED: <span id="score">0</span>
    </div>

    <script>
        let scene, camera, renderer, weapon;
        let score = 0;
        let ammo = 15;

        function startOperation() {
            document.getElementById('menu').style.display = 'none';
            init();
            animate();
        }

        function init() {
            // 1. Sahne ve Kamera Kurulumu
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020502);
            scene.fog = new THREE.Fog(0x020502, 1, 15); // Sis efekti

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 2. Işıklandırma (Gece Görüşü Işığı)
            const light = new THREE.PointLight(0x00ff00, 1, 50);
            camera.add(light);
            scene.add(camera);

            // 3. Yer ve Duvarlar (Basit bir koridor)
            const floorGeo = new THREE.PlaneGeometry(20, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // 4. Silah Modeli (Basit bir kutu ama silah gibi duracak)
            const weaponGeo = new THREE.BoxGeometry(0.1, 0.1, 0.5);
            const weaponMat = new THREE.MeshStandardMaterial({ color: 0x050505 });
            weapon = new THREE.Mesh(weaponGeo, weaponMat);
            weapon.position.set(0.2, -0.2, -0.5); // Ekranın sağ altında
            camera.add(weapon);

            // 5. Ateş Etme Mekaniği
            window.addEventListener('mousedown', shoot);
            window.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
        }

        function shoot() {
            if (ammo <= 0) {
                ammo = 15;
                document.getElementById('ammo').innerText = ammo;
                return;
            }
            ammo--;
            document.getElementById('ammo').innerText = ammo;

            // Ateş Işığı
            const flash = new THREE.PointLight(0xffaa00, 2, 10);
            flash.position.set(weapon.position.x, weapon.position.y, weapon.position.z - 0.5);
            camera.add(flash);
            setTimeout(() => { camera.remove(flash); }, 50);

            // Geri Tepme
            camera.position.y += 0.05;
            setTimeout(() => { camera.position.y -= 0.05; }, 50);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Silahın hafif sallanması (Nefes alma efekti)
            const time = Date.now() * 0.002;
            weapon.position.y = -0.2 + Math.sin(time) * 0.01;
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
