<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ENES_SNAKE_PRO</title>
    <style>
        body { 
            margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; 
            background: #87CEEB url('https://images.unsplash.com/photo-1534088568595-a066f77c3ed2?auto=format&fit=crop&w=1000&q=80') no-repeat center center fixed;
            background-size: cover; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header { background: rgba(255,255,255,0.85); padding: 12px 30px; border-radius: 25px; margin-top: 15px; backdrop-filter: blur(8px); text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.1); border: 2px solid #fff; }
        .stats { color: #2c3e50; font-weight: bold; font-size: 22px; }
        .rank { color: #27ae60; font-weight: bold; font-size: 16px; margin-top: 3px; }
        canvas { 
            border: 10px solid white; box-shadow: 0 15px 40px rgba(0,0,0,0.2); 
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(5px);
            margin-top: 10px; width: 330px; height: 330px; border-radius: 20px; 
        }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
        .btn { 
            width: 70px; height: 70px; background: white; border: none; color: #3498db; 
            border-radius: 20px; font-size: 30px; box-shadow: 0 5px 0 #bdc3c7; 
            touch-action: manipulation;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #bdc3c7; background: #f1f1f1; }
        #restart-btn { display: none; padding: 12px 30px; background: #3498db; color: white; font-weight: bold; border: none; margin-top: 10px; border-radius: 25px; cursor: pointer; font-size: 18px; }
        .floating-score { position: absolute; color: #e67e22; font-weight: bold; font-size: 28px; pointer-events: none; text-shadow: 2px 2px 0 white; animation: floatUp 1.5s forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }
    </style>
</head>
<body>
    <div class="header">
        <div class="stats">🍎 Puan: <span id="score">0</span></div>
        <div class="rank">Unvan: <span id="rank-text">Yumurta 🥚</span></div>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button id="restart-btn" onclick="resetGame()">Hadi Baştan! 🔄</button>
    <div class="controls">
        <button class="btn" style="grid-column: 2;" onmousedown="move('UP')" ontouchstart="move('UP')">▲</button>
        <button class="btn" style="grid-column: 1;" onmousedown="move('LEFT')" ontouchstart="move('LEFT')">◀</button>
        <button class="btn" style="grid-column: 3;" onmousedown="move('RIGHT')" ontouchstart="move('RIGHT')">▶</button>
        <button class="btn" style="grid-column: 2;" onmousedown="move('DOWN')" ontouchstart="move('DOWN')">▼</button>
    </div>

    <audio id="natureSound" loop><source src="https://www.soundjay.com/nature/sounds/birds-chirping-01.mp3"></audio>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const natureAudio = document.getElementById("natureSound");
        const grid = 20;
        
        let snake = [{x: 200, y: 200}, {x: 180, y: 200}, {x: 160, y: 200}];
        let dx = grid, dy = 0, score = 0, running = true, food = {x: 100, y: 100};
        let nextDir = {x: grid, y: 0};
        let gameSpeed = 150; // Başlangıç hızı (Yavaş)

        function playInceBeep() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = 1100; gain.gain.value = 0.05;
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        }

        function createFloatingScore() {
            const div = document.createElement("div");
            div.className = "floating-score";
            div.innerText = "+10";
            div.style.left = "50%";
            div.style.top = "200px";
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 1500);
        }

        function updateRank() {
            const rt = document.getElementById("rank-text");
            if (score < 50) rt.innerText = "Yumurta 🥚";
            else if (score < 100) rt.innerText = "Yavru Yılan 🐍";
            else if (score < 150) rt.innerText = "Çimen Gezgini 🌱";
            else if (score < 200) rt.innerText = "Elma Meraklısı 🍎";
            else if (score < 300) rt.innerText = "Hızlı Piton 💨";
            else rt.innerText = "Yılan Kral 👑";
        }

        function drawSnake() {
            ctx.strokeStyle = "#2ecc71";
            ctx.lineCap = "round"; ctx.lineJoin = "round";
            ctx.lineWidth = 18;
            ctx.beginPath();
            snake.forEach((part, i) => {
                if(i === 0) ctx.moveTo(part.x + 10, part.y + 10);
                else ctx.lineTo(part.x + 10, part.y + 10);
            });
            ctx.stroke();

            // Kafa detayları
            const head = snake[0];
            ctx.fillStyle = "white";
            ctx.beginPath(); ctx.arc(head.x+7, head.y+7, 3, 0, 7); ctx.arc(head.x+13, head.y+7, 3, 0, 7); ctx.fill();
            ctx.fillStyle = "black";
            ctx.beginPath(); ctx.arc(head.x+7, head.y+7, 1.2, 0, 7); ctx.arc(head.x+13, head.y+7, 1.2, 0, 7); ctx.fill();
            
            ctx.strokeStyle = "red"; ctx.lineWidth = 2;
            ctx.beginPath();
            if(dx > 0) { ctx.moveTo(head.x+20, head.y+10); ctx.lineTo(head.x+26, head.y+10); }
            else if(dx < 0) { ctx.moveTo(head.x, head.y+10); ctx.lineTo(head.x-6, head.y+10); }
            ctx.stroke();
        }

        function drawFood() {
            // Gerçekçi Elma
            ctx.fillStyle = "#e74c3c";
            ctx.beginPath(); ctx.arc(food.x+10, food.y+10, 10, 0, 7); ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.5)"; // Parlama efekti
            ctx.beginPath(); ctx.arc(food.x+7, food.y+7, 3, 0, 7); ctx.fill();
            ctx.fillStyle = "#27ae60"; // Yaprak
            ctx.fillRect(food.x+9, food.y-2, 3, 5);
        }

        function move(d) {
            if(natureAudio.paused) natureAudio.play();
            if (d==='UP' && dy===0) nextDir = {x:0, y:-grid};
            if (d==='DOWN' && dy===0) nextDir = {x:0, y:grid};
            if (d==='LEFT' && dx===0) nextDir = {x:-grid, y:0};
            if (d==='RIGHT' && dx===0) nextDir = {x:grid, y:0};
        }

        function advanceSnake() {
            dx = nextDir.x; dy = nextDir.y;
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            if (head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400 || snake.some(p => p.x === head.x && p.y === head.y)) {
                running = false; document.getElementById('restart-btn').style.display = "block";
                return;
            }

            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').innerText = score;
                playInceBeep();
                createFloatingScore();
                updateRank();
                createFood();
                // Her elma yediğinde oyun hızlanır (Max hıza kadar)
                if (gameSpeed > 60) gameSpeed -= 5;
            } else { snake.pop(); }
        }

        function createFood() {
            food = {
                x: Math.floor(Math.random() * (400/grid)) * grid,
                y: Math.floor(Math.random() * (400/grid)) * grid
            };
        }

        function resetGame() {
            snake = [{x: 200, y: 200}, {x: 180, y: 200}, {x: 160, y: 200}];
            dx = grid; dy = 0; nextDir = {x:grid, y:0}; score = 0; running = true;
            gameSpeed = 150; 
            document.getElementById('restart-btn').style.display = "none";
            document.getElementById('score').innerText = 0; updateRank();
            createFood(); main();
        }

        function main() {
            if (!running) return;
            setTimeout(() => {
                ctx.clearRect(0,0,400,400);
                drawFood(); drawSnake(); advanceSnake(); main();
            }, gameSpeed);
        }

        createFood(); main();
    </script>
</body>
</html>
