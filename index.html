<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKE_PRO_V2_OPTIMIZED</title>
    <style>
        body { margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; background: #2c3e50; color: white; font-family: sans-serif; }
        canvas { background: #34495e; border: 5px solid #fff; margin-top: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .stats { font-size: 24px; margin-top: 10px; }
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .btn { width: 60px; height: 60px; border-radius: 15px; border: none; font-size: 24px; }
        #restart-btn { display: none; margin-top: 10px; padding: 10px 20px; background: #e74c3c; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="stats">Puan: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button id="restart-btn" onclick="resetGame()">Yeniden Başlat</button>
    <div class="controls">
        <button class="btn" style="grid-column: 2;" onclick="move({x:0, y:-20})">▲</button>
        <button class="btn" style="grid-column: 1;" onclick="move({x:-20, y:0})">◀</button>
        <button class="btn" style="grid-column: 3;" onclick="move({x:20, y:0})">▶</button>
        <button class="btn" style="grid-column: 2;" onclick="move({x:0, y:20})">▼</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const grid = 20;
        let snake = [{x: 200, y: 200}], dx = grid, dy = 0, score = 0, food = {x: 100, y: 100}, running = true;
        let lastTime = 0, gameSpeed = 150, inputQueue = [];

        function move(dir) {
            if ((dir.x === -dx || dir.y === -dy) && snake.length > 1) return;
            inputQueue.push(dir);
        }

        function draw() {
            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, 0, 400, 400);
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(food.x, food.y, grid-2, grid-2);
            ctx.fillStyle = "#2ecc71";
            snake.forEach(part => ctx.fillRect(part.x, part.y, grid-2, grid-2));
        }

        function update(time) {
            if (!running) return;
            requestAnimationFrame(update);
            if (time - lastTime < gameSpeed) return;
            lastTime = time;

            if (inputQueue.length > 0) {
                let next = inputQueue.shift();
                dx = next.x; dy = next.y;
            }

            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if (head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400 || snake.some(p => p.x === head.x && p.y === head.y)) {
                running = false; document.getElementById('restart-btn').style.display = "block";
                return;
            }

            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10; document.getElementById('score').innerText = score;
                food = {x: Math.floor(Math.random()*20)*20, y: Math.floor(Math.random()*20)*20};
                gameSpeed = Math.max(50, gameSpeed - 2);
            } else { snake.pop(); }
            draw();
        }

        function resetGame() {
            snake = [{x: 200, y: 200}]; dx = grid; dy = 0; score = 0; running = true; gameSpeed = 150;
            document.getElementById('restart-btn').style.display = "none";
            document.getElementById('score').innerText = "0";
            requestAnimationFrame(update);
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
