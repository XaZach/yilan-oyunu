<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake.io Pro - XaZach Edition</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --snake-head: #38bdf8;
            --snake-body: #0ea5e9;
            --food-color: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            overflow: hidden;
            border: 4px solid #1e293b;
        }

        canvas {
            display: block;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 20px 20px;
            background-color: #0f172a;
        }

        /* Menü ve Skin Seçimi */
        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--snake-head);
            z-index: 10;
        }

        .skin-options {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        .skin-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: 0.3s;
        }

        .skin-btn.active {
            border-color: white;
            transform: scale(1.2);
        }

        button#start-btn {
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px;
        }

        /* Mobil Kontroller */
        #controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            user-select: none;
        }

        .btn:active { background: rgba(56, 189, 248, 0.4); }

        #score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            #controls { display: grid; }
        }
    </style>
</head>
<body>

    <div id="score-board">Puan: 0</div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="menu">
            <h1>SNAKE.IO PRO</h1>
            <p>Yılanının Rengini Seç:</p>
            <div class="skin-options">
                <div class="skin-btn active" style="background: #38bdf8;" onclick="setSkin('#38bdf8', '#0ea5e9', this)"></div>
                <div class="skin-btn" style="background: #f87171;" onclick="setSkin('#f87171', '#dc2626', this)"></div>
                <div class="skin-btn" style="background: #4ade80;" onclick="setSkin('#4ade80', '#16a34a', this)"></div>
                <div class="skin-btn" style="background: #fbbf24;" onclick="setSkin('#fbbf24', '#d97706', this)"></div>
                <div class="skin-btn" style="background: #c084fc;" onclick="setSkin('#c084fc', '#9333ea', this)"></div>
            </div>
            <button id="start-btn">OYUNA BAŞLA</button>
        </div>
    </div>

    <div id="controls">
        <div></div>
        <div class="btn" ontouchstart="changeDir('UP')">▲</div>
        <div></div>
        <div class="btn" ontouchstart="changeDir('LEFT')">◀</div>
        <div class="btn" ontouchstart="changeDir('DOWN')">▼</div>
        <div class="btn" ontouchstart="changeDir('RIGHT')">▶</div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score-board");
    const menu = document.getElementById("menu");
    const startBtn = document.getElementById("start-btn");

    // Ekran boyutuna göre ayarla
    const isMobile = window.innerWidth < 768;
    canvas.width = isMobile ? window.innerWidth - 40 : 600;
    canvas.height = isMobile ? window.innerHeight * 0.5 : 400;

    const box = 20;
    let score = 0;
    let gameSpeed = 120;
    let snake = [];
    let food = {};
    let d = "RIGHT";
    let gameInterval;
    let snakeColor = "#38bdf8";
    let snakeBodyColor = "#0ea5e9";

    function setSkin(head, body, btn) {
        snakeColor = head;
        snakeBodyColor = body;
        document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function initGame() {
        snake = [{ x: 9 * box, y: 10 * box }];
        score = 0;
        d = "RIGHT";
        gameSpeed = 120;
        scoreElement.innerHTML = "Puan: " + score;
        createFood();
        if(gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(draw, gameSpeed);
        menu.style.display = "none";
    }

    function createFood() {
        food = {
            x: Math.floor(Math.random() * (canvas.width/box)) * box,
            y: Math.floor(Math.random() * (canvas.height/box)) * box
        };
    }

    document.addEventListener("keydown", (e) => {
        if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
        else if(e.keyCode == 38 && d != "DOWN") d = "UP";
        else if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
        else if(e.keyCode == 40 && d != "UP") d = "DOWN";
    });

    function changeDir(dir) {
        if(dir == "LEFT" && d != "RIGHT") d = "LEFT";
        if(dir == "UP" && d != "DOWN") d = "UP";
        if(dir == "RIGHT" && d != "LEFT") d = "RIGHT";
        if(dir == "DOWN" && d != "UP") d = "DOWN";
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Yılanı çiz (Parlayan halkalar)
        for (let i = 0; i < snake.length; i++) {
            ctx.beginPath();
            ctx.arc(snake[i].x + box/2, snake[i].y + box/2, box/2 - 1, 0, Math.PI * 2);
            ctx.fillStyle = (i == 0) ? snakeColor : snakeBodyColor;
            ctx.fill();
            
            // Parlama efekti
            if(i == 0) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = snakeColor;
            } else {
                ctx.shadowBlur = 0;
            }
            ctx.closePath();
        }

        // Elmayı çiz (Gerçekçi parlama)
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#ef4444";
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(food.x + box/2, food.y + box/2, box/2 - 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        let snakeX = snake[0].x;
        let snakeY = snake[0].y;

        if (d == "LEFT") snakeX -= box;
        if (d == "UP") snakeY -= box;
        if (d == "RIGHT") snakeX += box;
        if (d == "DOWN") snakeY += box;

        // Duvarlardan geçme (Snake.io tarzı)
        if (snakeX < 0) snakeX = canvas.width - box;
        else if (snakeX >= canvas.width) snakeX = 0;
        if (snakeY < 0) snakeY = canvas.height - box;
        else if (snakeY >= canvas.height) snakeY = 0;

        if (snakeX == food.x && snakeY == food.y) {
            score++;
            scoreElement.innerHTML = "Puan: " + score;
            createFood();
            // Hızlanma
            if(gameSpeed > 50) {
                clearInterval(gameInterval);
                gameSpeed -= 2;
                gameInterval = setInterval(draw, gameSpeed);
            }
        } else {
            snake.pop();
        }

        let newHead = { x: snakeX, y: snakeY };

        // Kendine çarpma kontrolü
        for(let i=0; i<snake.length; i++){
            if(newHead.x == snake[i].x && newHead.y == snake[i].y){
                gameOver();
                return;
            }
        }

        snake.unshift(newHead);
    }

    function gameOver() {
        clearInterval(gameInterval);
        alert("OYUN BİTTİ! Puanın: " + score);
        menu.style.display = "block";
    }

    startBtn.onclick = initGame;
</script>
</body>
</html>
